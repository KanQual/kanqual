<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quallect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1e1e1c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e8e8e0;
      user-select: none;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 13px;
      color: #8a8a7e;
      margin-bottom: 40px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #2e2e2c;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .status {
      margin-top: 16px;
      font-size: 12px;
      color: #8a8a7e;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo">Quallect</div>
  <div class="tagline">Text annotation for qualitative research</div>
  <div class="spinner"></div>
  <div class="status">Starting up…</div>
</body>
</html>
