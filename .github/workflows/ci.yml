name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Fetch bundled PostgreSQL runtime
        run: npm run fetch:bundled-postgres -- --target windows-x86_64

      - name: Validate bundled PostgreSQL runtime staging
        run: npm run prepare:bundled-postgres:strict

      - name: Run native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Validate role matrix when source CSV is present
        shell: pwsh
        run: |
          if (Test-Path "role_permission_matrix_recommended.csv") {
            npm run validate:roles
          } else {
            Write-Host "Skipping role matrix validation because role_permission_matrix_recommended.csv is not present."
          }
