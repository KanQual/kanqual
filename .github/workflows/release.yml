name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_label: windows
            smoke_platform: windows
            smoke_packaged_args: ""
            appimage_extract_and_run: ""
            postgres_runtime_target: "windows-x86_64"
            bundle_targets: "nsis"
            artifact_glob: "src-tauri/target/release/bundle/**/*"
            runtime_smoke_command: "npm run smoke:runtime -- --platform windows --hold-ms 2000 --timeout-ms 120000"
          - os: macos-latest
            platform_label: macos
            smoke_platform: macos
            smoke_packaged_args: ""
            appimage_extract_and_run: ""
            postgres_runtime_target: "macos-aarch64"
            bundle_targets: "app,dmg"
            artifact_glob: "src-tauri/target/release/bundle/**/*"
            runtime_smoke_command: "npm run smoke:runtime -- --platform macos --hold-ms 3000 --timeout-ms 150000"
          - os: macos-15-intel
            platform_label: macos-intel
            smoke_platform: macos
            smoke_packaged_args: ""
            appimage_extract_and_run: ""
            postgres_runtime_target: "macos-x86_64"
            bundle_targets: "app,dmg"
            artifact_glob: "src-tauri/target/release/bundle/**/*"
            runtime_smoke_command: "npm run smoke:runtime -- --platform macos --hold-ms 3000 --timeout-ms 150000"
          - os: ubuntu-22.04
            platform_label: linux
            smoke_platform: linux
            smoke_packaged_args: ""
            appimage_extract_and_run: "1"
            postgres_runtime_target: "linux-x86_64"
            bundle_targets: "appimage,deb"
            artifact_glob: "src-tauri/target/release/bundle/**/*"
            runtime_smoke_command: "xvfb-run -a npm run smoke:runtime -- --platform linux --hold-ms 3000 --timeout-ms 150000"

    runs-on: ${{ matrix.os }}
    env:
      CI: true
      KANQUAL_POSTGRES_RUNTIME_TARGET: ${{ matrix.postgres_runtime_target }}
      RUST_BACKTRACE: full
      APPIMAGE_EXTRACT_AND_RUN: ${{ matrix.appimage_extract_and_run }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            build-essential \
            curl \
            file \
            wget \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            xvfb

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch bundled PostgreSQL runtime for this platform
        run: npm run fetch:bundled-postgres -- --target ${{ matrix.postgres_runtime_target }}

      - name: Validate bundled PostgreSQL runtime staging
        run: npm run prepare:bundled-postgres:strict

      - name: Verify frontend and native tests
        shell: pwsh
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Report Linux packaging environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          rustc --version --verbose
          cargo --version --verbose
          node --version
          npm --version
          df -h
          pkg-config --modversion gtk+-3.0
          pkg-config --modversion webkit2gtk-4.1
          du -sh src-tauri/resources/runtime/postgresql-17
          find src-tauri/resources/runtime/postgresql-17 -type f | wc -l
          file \
            src-tauri/resources/runtime/postgresql-17/bin/postgres \
            src-tauri/resources/runtime/postgresql-17/bin/initdb \
            src-tauri/resources/runtime/postgresql-17/bin/pg_ctl

      - name: Validate Linux runtime dynamic dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="src-tauri/resources/runtime/postgresql-17"
          missing_dependencies=0

          while IFS= read -r -d '' candidate; do
            if ! file -b "$candidate" | grep -q '^ELF '; then
              continue
            fi

            dependencies="$(LD_LIBRARY_PATH="$runtime_root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ldd "$candidate" 2>&1 || true)"
            if grep -q 'not found' <<<"$dependencies"; then
              echo "Missing dynamic dependency for $candidate:"
              grep 'not found' <<<"$dependencies"
              missing_dependencies=1
            fi
          done < <(find "$runtime_root" -type f -print0)

          if (( missing_dependencies != 0 )); then
            exit 1
          fi

      - name: Build cross-platform release bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: "Kanqual ${{ github.ref_name }}"
          releaseBody: "Automated release for ${{ github.ref_name }}."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: --bundles ${{ matrix.bundle_targets }}

      - name: Create Windows portable bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $targetRoot = Join-Path $PWD "src-tauri/target/release"
          $bundleRoot = Join-Path $targetRoot "bundle"
          $portableName = "Kanqual_${version}_x64_portable"
          $portableDir = Join-Path (Join-Path $bundleRoot "portable") $portableName
          $portableZip = "${portableDir}.zip"

          if (-not (Test-Path (Join-Path $targetRoot "kanqual.exe"))) {
            Write-Error "Portable packaging failed: src-tauri/target/release/kanqual.exe was not found."
            exit 1
          }

          if (Test-Path $portableDir) {
            Remove-Item -LiteralPath $portableDir -Recurse -Force
          }
          if (Test-Path $portableZip) {
            Remove-Item -LiteralPath $portableZip -Force
          }

          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $portableDir "data") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $portableDir "runtime") | Out-Null

          Copy-Item -LiteralPath (Join-Path $targetRoot "kanqual.exe") -Destination (Join-Path $portableDir "kanqual.exe") -Force
          Copy-Item -LiteralPath (Join-Path $PWD "src-tauri/resources/runtime/postgresql-17") -Destination (Join-Path $portableDir "runtime/postgresql-17") -Recurse -Force
          Set-Content -LiteralPath (Join-Path $portableDir "portable-mode.json") -Value "{}" -NoNewline
          Copy-Item -LiteralPath (Join-Path $PWD "LICENSE") -Destination $portableDir -Force
          Copy-Item -LiteralPath (Join-Path $PWD "LICENSES.md") -Destination $portableDir -Force
          Copy-Item -LiteralPath (Join-Path $PWD "THIRD_PARTY_NOTICES.md") -Destination $portableDir -Force
          Copy-Item -LiteralPath (Join-Path $PWD "licenses") -Destination $portableDir -Recurse -Force

          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $portableZip -Force
          Write-Host "Created portable bundle: $portableZip"

      - name: Run packaged artifact smoke test
        run: npm run smoke:packaged -- --platform ${{ matrix.smoke_platform }} ${{ matrix.smoke_packaged_args }}

      - name: Run packaged runtime smoke test
        if: runner.os != 'Windows'
        shell: pwsh
        run: ${{ matrix.runtime_smoke_command }}

      - name: Record Windows runtime smoke limitation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "The hosted Windows runner uses an elevated administrator token that PostgreSQL intentionally refuses for server startup."
          Write-Host "Windows package contents and native tests passed; the portable runtime smoke flow is validated under a normal desktop user token."

      - name: Generate checksums for packaged artifacts
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $PWD "src-tauri/target/release/bundle"
          if (-not (Test-Path $bundleRoot)) {
            Write-Error "Bundle directory not found: $bundleRoot"
            exit 1
          }
          $artifacts = Get-ChildItem -Path $bundleRoot -File -Recurse | Where-Object {
            $_.Extension -in ".msi", ".exe", ".zip", ".dmg", ".appimage", ".deb"
          }
          if ($artifacts.Count -eq 0) {
            Write-Error "No packaged artifacts found under $bundleRoot"
            exit 1
          }
          $lines = foreach ($artifact in $artifacts) {
            $hash = Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256
            "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $artifact.Name
          }
          $checksumPath = Join-Path $bundleRoot "SHA256SUMS-${{ matrix.platform_label }}.txt"
          Set-Content -LiteralPath $checksumPath -Value $lines
          Write-Host "Wrote checksums to $checksumPath"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v6
        with:
          name: kanqual-${{ github.ref_name }}-${{ matrix.platform_label }}
          path: |
            ${{ matrix.artifact_glob }}
            src-tauri/target/release/bundle/SHA256SUMS-${{ matrix.platform_label }}.txt
